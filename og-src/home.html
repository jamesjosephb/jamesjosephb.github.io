<!doctype html>
<!--
  Source for public/og/home.png (1200x630), "Contour" direction with the realistic topo map.
  The map is the same tile the site draws (public/topo/*, from scripts/topo-gen.mjs, seed 23), painted with the dark
  theme's map colours, with the tile's main summit (1120, 470) under the portrait. Re-render: see README "Social card".
  Fonts load from Google Fonts at render time only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&family=DM+Mono:wght@400;500&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; box-sizing: border-box; padding: 64px 72px;
    background: #0E1720; color: #E3EAF0; font-family: "Hanken Grotesk", sans-serif;
    /* Portrait centre; the map's summit sits here. */
    --sx: 940px; --sy: 300px;
  }
  /* Map layers: the site's tile used as masks, painted with slightly stronger dark-theme colours so the lines survive a thumbnail. */
  .layer {
    position: absolute; inset: 0;
    -webkit-mask-image: var(--tile), radial-gradient(circle at var(--sx) var(--sy), #000 0, #000 330px, rgb(0 0 0 / 0.55) 620px, rgb(0 0 0 / 0.35) 900px);
    -webkit-mask-size: 1600px 1600px, 100% 100%;
    -webkit-mask-repeat: repeat, no-repeat;
    -webkit-mask-position: calc(var(--sx) - 1120px) calc(var(--sy) - 470px), 0 0;
    -webkit-mask-composite: source-in;
  }
  .shade  { --tile: url('../public/topo/shade.png');   background: rgb(0 0 0 / 0.45); }
  .minor  { --tile: url('../public/topo/minor.svg');   background: #22343F; }
  .stream { --tile: url('../public/topo/streams.svg'); background: #1F3C57; }
  .index  { --tile: url('../public/topo/index.svg');   background: #35506A; }
  /* Keep the copy column calm: the map fades out under the headline. */
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, #0E1720 0, rgb(14 23 32 / 0.86) 470px, rgb(14 23 32 / 0) 720px); }
  .photo {
    position: absolute; left: var(--sx); top: var(--sy); width: 236px; height: 236px; transform: translate(-50%, -50%);
    border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 8px #0E1720, 0 0 0 10px #4A6A88, 0 18px 50px rgb(0 0 0 / 0.5);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); }
  .copy { position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 100%; max-width: 640px; }
  .label { font: 500 20px/1 "DM Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #75BBFF; }
  h1 { margin: 0; font-weight: 700; font-size: 74px; line-height: 1.03; letter-spacing: -0.035em; }
  .hl { background: #173653; color: #D7EAFE; padding: 0 8px; border-radius: 8px; -webkit-box-decoration-break: clone; }
  .foot { font: 600 28px/1.25 "Hanken Grotesk", sans-serif; }
  .foot .url { display: block; margin-top: 6px; font: 500 22px/1 "DM Mono", monospace; color: #75BBFF; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <i class="layer shade"></i><i class="layer minor"></i><i class="layer stream"></i><i class="layer index"></i>
  <i class="veil"></i>
  <div class="photo"><img src="../src/assets/portrait.png" alt=""></div>
  <div class="copy">
    <span class="label">AI agent engineering · Tech lead</span>
    <h1>I build <span class="hl">AI agent tooling</span> for engineering teams.</h1>
    <div class="foot">James Burch<span class="url">jamesjburch.com</span></div>
  </div>
</body>
</html>
